name: Cost Start

on:
  workflow_dispatch:
    inputs:
      account_group:
        description: "対象account_group（nonprod/prod）"
        required: true
        default: "nonprod"
      env:
        description: "対象env（dev/staging/production）"
        required: true
        default: "dev"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  # state分割（コンポーネント単位）に伴い、依存順（network→backend→frontend→monitoring）に
  # applyする必要がある。参照先が未applyだと参照元のplan/applyが失敗するため、
  # このワークフロー内では並列化せず直列に実行すること
  NETWORK_DIR: envs/${{ github.event.inputs.account_group }}/${{ github.event.inputs.env }}/network
  BACKEND_DIR: envs/${{ github.event.inputs.account_group }}/${{ github.event.inputs.env }}/backend
  FRONTEND_DIR: envs/${{ github.event.inputs.account_group }}/${{ github.event.inputs.env }}/frontend
  MONITORING_DIR: envs/${{ github.event.inputs.account_group }}/${{ github.event.inputs.env }}/monitoring
  RDS_INSTANCE: tomario-${{ github.event.inputs.env }}-rds
  ECS_CLUSTER: tomario-${{ github.event.inputs.env }}-cluster
  ECS_SERVICE: tomario-${{ github.event.inputs.env }}-service
  TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

jobs:
  cost-start:
    name: Start Resources
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.account_group }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Start RDS
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ env.RDS_INSTANCE }} \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text)
          if [ "$STATUS" = "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier ${{ env.RDS_INSTANCE }}
          else
            echo "RDS is already in '$STATUS' state, skipping start."
          fi

      - name: Wait for RDS to be available
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ env.RDS_INSTANCE }} \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text)
          if [ "$STATUS" != "available" ]; then
            aws rds wait db-instance-available \
              --db-instance-identifier ${{ env.RDS_INSTANCE }}
          else
            echo "RDS is already available, skipping wait."
          fi

      - name: Terraform Init (network)
        working-directory: ${{ env.NETWORK_DIR }}
        run: terraform init

      - name: Terraform Apply (network)
        working-directory: ${{ env.NETWORK_DIR }}
        run: terraform apply -auto-approve

      - name: Terraform Init (backend)
        working-directory: ${{ env.BACKEND_DIR }}
        run: terraform init

      - name: Terraform Apply (backend)
        working-directory: ${{ env.BACKEND_DIR }}
        run: terraform apply -auto-approve

      - name: Terraform Init (frontend)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: terraform init

      - name: Terraform Apply (frontend)
        working-directory: ${{ env.FRONTEND_DIR }}
        # backendが再作成したALBの新しいDNS名をCloudFrontのoriginへ反映するために必要
        run: terraform apply -auto-approve

      - name: Terraform Init (monitoring)
        working-directory: ${{ env.MONITORING_DIR }}
        run: terraform init

      - name: Terraform Apply (monitoring)
        working-directory: ${{ env.MONITORING_DIR }}
        # backendが再作成したALB/ECSサービスの新しい識別子をアラームのディメンションへ反映するために必要
        run: terraform apply -auto-approve

      - name: Scale ECS to desired count
        run: |
          case "${{ github.event.inputs.env }}" in
            staging) DESIRED_COUNT=2 ;;
            *) DESIRED_COUNT=1 ;;
          esac
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --desired-count $DESIRED_COUNT \
            --region ${{ env.AWS_REGION }}
