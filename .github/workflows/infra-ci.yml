name: Terraform CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "envs/**"
      - "modules/**"
  pull_request:
    paths:
      - "envs/**"
      - "modules/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-northeast-1

jobs:
  set-matrix:
    name: Set Matrix
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.set-matrix.outputs.component }}
      flat: ${{ steps.set-matrix.outputs.flat }}
      cd_logging: ${{ steps.set-matrix.outputs.cd_logging }}
      cd_account: ${{ steps.set-matrix.outputs.cd_account }}
      cd_network: ${{ steps.set-matrix.outputs.cd_network }}
      cd_database: ${{ steps.set-matrix.outputs.cd_database }}
      cd_backend: ${{ steps.set-matrix.outputs.cd_backend }}
      cd_frontend_monitoring: ${{ steps.set-matrix.outputs.cd_frontend_monitoring }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # workflow_dispatch（差分の概念が無い手動実行）や、diffの基点が無効な場合は安全側に倒して全対象にする
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "full_matrix=true" >> "$GITHUB_OUTPUT"
            echo "changed_files=" >> "$GITHUB_OUTPUT"
          else
            echo "full_matrix=false" >> "$GITHUB_OUTPUT"
            FILES=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
            {
              echo "changed_files<<EOF_CHANGED_FILES"
              echo "$FILES"
              echo "EOF_CHANGED_FILES"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set Matrix
        id: set-matrix
        run: |
          # account_groupごとにenv構成が異なる：
          # - nonprod: dev/stagingはコンポーネント単位でstate分割、sharedはアカウント単位の
          #   シングルトンリソース（security/cost/ecr）をまとめた単一state（flat）
          # - prod: shared無し。productionが9コンポーネント全てを個別state分割で持つ
          #   （security/cost/ecrもproduction配下の独立コンポーネントとして扱う。flat無し）
          ACCOUNT_GROUPS="nonprod prod"
          declare -A SPLIT_ENVS_MAP=(
            [nonprod]="dev staging"
            [prod]="production"
          )
          declare -A FLAT_ENVS_MAP=(
            [nonprod]="shared"
            [prod]=""
          )
          declare -A COMPONENTS_MAP=(
            [nonprod]="logging network database backend frontend monitoring"
            [prod]="logging security cost ecr network database backend frontend monitoring"
          )

          build_full_matrix() {
            COMPONENT_PAIRS=""
            FLAT_LIST=""
            for ag in $ACCOUNT_GROUPS; do
              for e in ${SPLIT_ENVS_MAP[$ag]}; do
                for c in ${COMPONENTS_MAP[$ag]}; do
                  COMPONENT_PAIRS="$COMPONENT_PAIRS ${ag}:${e}:${c}"
                done
              done
              for e in ${FLAT_ENVS_MAP[$ag]}; do
                FLAT_LIST="$FLAT_LIST ${ag}:${e}"
              done
            done
          }

          if [ "${{ steps.changed.outputs.full_matrix }}" = "true" ]; then
            build_full_matrix
          else
            FILES="${{ steps.changed.outputs.changed_files }}"
            COMPONENT_PAIRS=""
            FLAT_LIST=""

            for ag in $ACCOUNT_GROUPS; do
              ENVS_DIR="envs/${ag}"

              # envs/{account_group}/{env}/{component}/** の変更 → そのaccount_group:env:componentを対象に追加
              for e in ${SPLIT_ENVS_MAP[$ag]}; do
                for c in ${COMPONENTS_MAP[$ag]}; do
                  if echo "$FILES" | grep -q "^${ENVS_DIR}/${e}/${c}/"; then
                    COMPONENT_PAIRS="$COMPONENT_PAIRS ${ag}:${e}:${c}"
                  fi
                done
              done

              # envs/{account_group}/{shared}/** の変更 → そのaccount_group:envを対象に追加
              for e in ${FLAT_ENVS_MAP[$ag]}; do
                if echo "$FILES" | grep -q "^${ENVS_DIR}/${e}/"; then
                  FLAT_LIST="$FLAT_LIST ${ag}:${e}"
                fi
              done
            done

            # modules/{name}/** の変更 → それを使う全account_group/envに波及させる
            CHANGED_MODULES=$(echo "$FILES" | sed -n 's|^modules/\([^/]*\)/.*|\1|p' | sort -u)
            for mod in $CHANGED_MODULES; do
              for ag in $ACCOUNT_GROUPS; do
                ENVS_DIR="envs/${ag}"
                # split env側は、component名 == module名なのでそのまま対応付けられる
                if echo "${COMPONENTS_MAP[$ag]}" | tr ' ' '\n' | grep -qx "$mod"; then
                  for e in ${SPLIT_ENVS_MAP[$ag]}; do
                    COMPONENT_PAIRS="$COMPONENT_PAIRS ${ag}:${e}:${mod}"
                  done
                fi
                # flat env側は、そのenvのmain.tfが実際にそのmoduleを呼んでいるかで判定（従来通り）
                for e in ${FLAT_ENVS_MAP[$ag]}; do
                  if grep -q "module \"${mod}\"" "${ENVS_DIR}/${e}/main.tf" 2>/dev/null; then
                    FLAT_LIST="$FLAT_LIST ${ag}:${e}"
                  fi
                done
              done
            done

            COMPONENT_PAIRS=$(echo "$COMPONENT_PAIRS" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
            FLAT_LIST=$(echo "$FLAT_LIST" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')

            # 変更内容から何も特定できなかった場合は、見逃しを避けるため安全側に倒して全対象にする
            if [ -z "$(echo "${COMPONENT_PAIRS}${FLAT_LIST}" | tr -d '[:space:]')" ]; then
              build_full_matrix
            fi
          fi

          # 設定上は対象でも、そのディレクトリがまだ存在しない（例：envs/prod/productionを
          # このCI変更のマージ後にまだ作っていない）場合はスキップする。CONFIGとリポジトリの
          # 実体を分離しておくことで、CI一般化のマージとenvs/prod/production構築の順序を
          # 気にしなくてよくなる（存在しないディレクトリへterraform initして落ちるのを防ぐ）。
          FILTERED_PAIRS=""
          for p in $COMPONENT_PAIRS; do
            ag="${p%%:*}"; rest="${p#*:}"; e="${rest%%:*}"; c="${rest#*:}"
            if [ -d "envs/${ag}/${e}/${c}" ]; then
              FILTERED_PAIRS="$FILTERED_PAIRS $p"
            fi
          done
          COMPONENT_PAIRS="$FILTERED_PAIRS"

          FILTERED_FLAT=""
          for p in $FLAT_LIST; do
            ag="${p%%:*}"; e="${p#*:}"
            if [ -d "envs/${ag}/${e}" ]; then
              FILTERED_FLAT="$FILTERED_FLAT $p"
            fi
          done
          FLAT_LIST="$FILTERED_FLAT"

          echo "Affected component pairs: $COMPONENT_PAIRS"
          echo "Affected flat envs: $FLAT_LIST"

          COMPONENT_JSON=$(echo "$COMPONENT_PAIRS" | tr ' ' '\n' | grep -v '^$' | \
            awk -F: '{printf "{\"account_group\":\"%s\",\"env\":\"%s\",\"component\":\"%s\"}\n", $1, $2, $3}' | \
            jq -s -c '.')

          FLAT_JSON=$(echo "$FLAT_LIST" | tr ' ' '\n' | grep -v '^$' | \
            awk -F: '{printf "{\"account_group\":\"%s\",\"env\":\"%s\"}\n", $1, $2}' | \
            jq -s -c '.')

          tier_matrix() {
            # $1: スペース区切りのcomponent名（このtierに含めるもの）
            echo "$COMPONENT_JSON" | jq -c --arg comps "$1" \
              '{"include": [.[] | select(.component as $c | ($comps | split(" ")) | index($c))]}'
          }

          {
            echo "component=$(echo "$COMPONENT_JSON" | jq -c '{"include": .}')"
            echo "flat=$(echo "$FLAT_JSON" | jq -c '{"include": .}')"
            echo "cd_logging=$(tier_matrix "logging")"
            echo "cd_account=$(tier_matrix "security cost ecr")"
            echo "cd_network=$(tier_matrix "network")"
            echo "cd_database=$(tier_matrix "database")"
            echo "cd_backend=$(tier_matrix "backend")"
            echo "cd_frontend_monitoring=$(tier_matrix "frontend monitoring")"
          } >> "$GITHUB_OUTPUT"

  terraform-ci-component:
    name: Terraform CI / ${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
    needs: set-matrix
    if: needs.set-matrix.outputs.component != '{"include":[]}'
    runs-on: ubuntu-latest
    environment: ${{ matrix.account_group }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.component) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform init

      - name: Terraform Validate
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        # frontendはbackendのALBが実在しないと（cost-stop中は常にそうなる）
        # CloudFront originのdomain_name未定義エラーで必ず失敗する既知の制約のため、
        # このコンポーネントに限りplan失敗をブロッキングにしない
        continue-on-error: ${{ matrix.component == 'frontend' }}
        run: terraform plan -no-color
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

  terraform-ci-flat:
    name: Terraform CI / ${{ matrix.account_group }}/${{ matrix.env }}
    needs: set-matrix
    if: needs.set-matrix.outputs.flat != '{"include":[]}'
    runs-on: ubuntu-latest
    environment: ${{ matrix.account_group }}
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.flat) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}
        run: terraform init

      - name: Terraform Validate
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}
        run: terraform plan -no-color
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub Actions Workflows
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  # componentのCDは依存順（logging→account(security/cost/ecr)→network→database→backend→frontend/monitoring）に
  # 直列実行する。account tierはprod専用（nonprodはshared/flat側で扱うためこのtierには乗らない）で、
  # backendがecrのイメージURLを参照する都合上、network/databaseより前に置く。
  # 分割前は単一state内でTerraformが依存関係を自動解決していたが、分割後は参照先が
  # 実際にapply済みでないと参照元のplan/applyが失敗するため、順序を明示的に固定する必要がある。
  terraform-cd-logging:
    name: Terraform CD / ${{ matrix.account_group }}/${{ matrix.env }}/logging
    needs: [set-matrix, terraform-ci-component]
    if: |
      always() &&
      (needs.terraform-ci-component.result == 'success' || needs.terraform-ci-component.result == 'skipped') &&
      needs.set-matrix.outputs.cd_logging != '{"include":[]}' &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ matrix.account_group }}
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.cd_logging) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform init
      - name: Terraform Apply
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform apply -auto-approve
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

  terraform-cd-account:
    name: Terraform CD / ${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
    needs: [set-matrix, terraform-cd-logging]
    if: |
      always() &&
      (needs.terraform-cd-logging.result == 'success' || needs.terraform-cd-logging.result == 'skipped') &&
      needs.set-matrix.outputs.cd_account != '{"include":[]}' &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ matrix.account_group }}
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.cd_account) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform init
      - name: Terraform Apply
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform apply -auto-approve
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

  terraform-cd-network:
    name: Terraform CD / ${{ matrix.account_group }}/${{ matrix.env }}/network
    needs: [set-matrix, terraform-cd-account]
    if: |
      always() &&
      (needs.terraform-cd-account.result == 'success' || needs.terraform-cd-account.result == 'skipped') &&
      needs.set-matrix.outputs.cd_network != '{"include":[]}' &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ matrix.account_group }}
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.cd_network) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform init
      - name: Terraform Apply
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform apply -auto-approve
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

  terraform-cd-database:
    name: Terraform CD / ${{ matrix.account_group }}/${{ matrix.env }}/database
    needs: [set-matrix, terraform-cd-network]
    if: |
      always() &&
      (needs.terraform-cd-network.result == 'success' || needs.terraform-cd-network.result == 'skipped') &&
      needs.set-matrix.outputs.cd_database != '{"include":[]}' &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ matrix.account_group }}
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.cd_database) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform init
      - name: Terraform Apply
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform apply -auto-approve
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

  terraform-cd-backend:
    name: Terraform CD / ${{ matrix.account_group }}/${{ matrix.env }}/backend
    needs: [set-matrix, terraform-cd-database]
    if: |
      always() &&
      (needs.terraform-cd-database.result == 'success' || needs.terraform-cd-database.result == 'skipped') &&
      needs.set-matrix.outputs.cd_backend != '{"include":[]}' &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ matrix.account_group }}
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.cd_backend) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform init
      - name: Terraform Apply
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform apply -auto-approve
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

  terraform-cd-frontend-monitoring:
    name: Terraform CD / ${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
    needs: [set-matrix, terraform-cd-backend]
    if: |
      always() &&
      (needs.terraform-cd-backend.result == 'success' || needs.terraform-cd-backend.result == 'skipped') &&
      needs.set-matrix.outputs.cd_frontend_monitoring != '{"include":[]}' &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ matrix.account_group }}
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.cd_frontend_monitoring) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform init
      - name: Terraform Apply
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}/${{ matrix.component }}
        run: terraform apply -auto-approve
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

  terraform-cd-flat:
    name: Terraform CD / ${{ matrix.account_group }}/${{ matrix.env }}
    needs: [set-matrix, terraform-ci-flat]
    if: |
      always() &&
      (needs.terraform-ci-flat.result == 'success' || needs.terraform-ci-flat.result == 'skipped') &&
      needs.set-matrix.outputs.flat != '{"include":[]}' &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ matrix.account_group }}
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.flat) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}
        run: terraform init
      - name: Terraform Apply
        working-directory: envs/${{ matrix.account_group }}/${{ matrix.env }}
        run: terraform apply -auto-approve
        env:
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
